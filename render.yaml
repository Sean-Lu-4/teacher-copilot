services:
  - type: web
    name: teacher-copilot-trial
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TEACHER_COPILOT_ENABLE_AI
        value: "0"
      - key: TEACHER_COPILOT_PUBLIC_DEMO
        value: "1"
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: TEACHER_COPILOT_ALLOWED_HOSTS
        sync: false
      - key: TEACHER_COPILOT_ALLOWED_ORIGINS
        sync: false
