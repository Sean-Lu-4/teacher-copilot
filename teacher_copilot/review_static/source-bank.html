<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP CSA · 导入资料题库</title><link rel="stylesheet" href="/style.css"><script src="/source-bank.js" defer></script></head><body><header><a class="brand" href="/">Teacher Copilot</a><nav><a class="nav-link" href="/">创建练习</a><a class="nav-link" href="/bank">原创题库</a><a class="nav-link active" href="/source-bank">导入资料题库</a></nav></header><main><section class="intro"><h1>AP CSA 资料题库</h1><p id="summary">正在加载…</p><p>这里是原始资料核对页。老师实际选题请进入 <a class="primary" href="/bank">按 Unit / Topic 整理的题库 →</a>，那里可以直接查看题干、选项、答案并加入组卷清单。</p><p>本页保留试题与评分指南原文，用于核对代码、图表、图片和英文评分标准。FRQ 按完整题组保留共同背景与所有小问。</p><p class="hint">仍待逐题核对的条目会标记为“待核对”，不会自动进入组卷。</p></section><section class="source-filters"><label>搜索<input id="search" type="search" placeholder="题干关键词或文件名"></label><label>单元<select id="unit"><option value="">全部单元</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>题型<select id="kind"><option value="">全部题型</option><option value="MCQ">MCQ 选择题</option><option value="FRQ">FRQ 完整题组</option></select></label><label>核对状态<select id="status"><option value="">全部状态</option><option value="paired">已配对</option><option value="needs_review">待核对</option><option value="missing_answer">缺少答案文件</option></select></label></section><div class="buttons"><strong id="count"></strong><button id="previous">上一页</button><button id="next">下一页</button></div><section id="rows"></section><details><summary>全部原始文件（含未完成配对的资料）</summary><div id="documents"></div></details></main></body></html>
