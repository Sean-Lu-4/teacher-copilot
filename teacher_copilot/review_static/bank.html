<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSA Studio · 题库</title><link rel="stylesheet" href="/style.css"><script src="/bank.js" defer></script><link rel="stylesheet" href="/studio.css"><script src="/layout.js" defer></script></head>
<body><header><a class="brand" href="/">CSA Studio<span>AP CSA 学习与教学</span></a><nav><a class="nav-link" href="/practice">学生刷题</a><a class="nav-link" href="/teacher">教师组卷</a><a class="nav-link active" aria-current="page" href="/bank">浏览题库</a><a class="nav-link" href="/library">我的练习</a></nav></header>
<main><section class="intro"><div class="eyebrow">AP COMPUTER SCIENCE A · QUESTION BANK</div><h1>按 Unit 和 Topic 选择题目，开始组卷</h1><p>按课题查看题目；跨课题题目可出现在多个分类中。难度尚未标定的题目会单独标注。</p><p>筛选题目后，点击“加入组卷清单”。选好后使用清单顶部的组卷按钮。</p></section>
<section class="bank-layout"><aside class="bank-filters"><button id="filter-toggle" class="secondary wide" type="button" aria-expanded="false" aria-controls="filter-fields">筛选题目</button><div id="filter-fields"><label>搜索题目<input id="search" type="search" placeholder="标题、题干或题目编号"></label><label>单元<select id="unit"><option value="">全部单元</option><option value="1">Unit 1</option><option value="2">Unit 2</option><option value="3">Unit 3</option><option value="4">Unit 4</option></select></label><label>课题<select id="topic"><option value="">全部课题</option></select></label><label>难度<select id="level"><option value="">全部难度</option><option value="1">基础识别</option><option value="2">单步应用</option><option value="3">巩固应用</option><option value="4">考试风格</option><option value="unrated">尚未标定</option></select></label><label>题型<select id="kind"><option value="">全部题型</option></select></label><label>单题预计用时上限<div class="time"><input id="minutes" type="number" min="1" max="180" step="1" placeholder="不限"><span>分钟</span></div></label><p class="hint">留空为不限；预计用时仅供安排练习参考。</p><button id="clear" class="secondary wide">清除筛选</button></div></aside><section class="bank-results"><div class="bank-toolbar"><strong id="count">正在载入题库…</strong><span class="hint">点击题目可查看答案和评分标准</span><div class="bank-pagination"><button id="previous" class="secondary">上一页</button><button id="next" class="secondary">下一页</button></div></div><div id="results"></div></section></section></main><footer>CSA Studio · 专注 AP Computer Science A</footer></body></html>
