<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Copilot · 题库</title><link rel="stylesheet" href="/style.css"><script src="/bank.js" defer></script></head>
<body><header><a class="brand" href="/">Teacher Copilot<span>教师备课助手</span></a><nav><a class="nav-link" href="/">创建练习</a><a class="nav-link active" aria-current="page" href="/bank">浏览题库</a><a class="nav-link" href="/library">我的练习</a><a class="nav-link" href="/curriculum">课程审核</a><span class="local">本地题库 · 可筛选组卷</span></nav></header>
<main><section class="intro"><div class="eyebrow">AP COMPUTER SCIENCE A · QUESTION BANK</div><h1>按 Unit 和 Topic 选择题目，开始组卷</h1><p>Progress Check / Question Bank 已提取题干、选项、答案和英文评分指南，并按 Unit / Topic 放入下面的题库。</p><p><a href="/source-bank">查看原始 PDF 与配对记录 →</a></p><p>筛选题目后，点击“加入组卷清单”。选好后使用清单顶部的组卷按钮。</p></section>
<section class="bank-layout"><aside class="bank-filters"><label>搜索题目<input id="search" type="search" placeholder="标题、题干或题目编号"></label><label>课题<select id="topic"><option value="">全部课题</option></select></label><label>难度<select id="level"><option value="">全部难度</option><option value="1">基础识别</option><option value="2">单步应用</option><option value="3">巩固应用</option><option value="4">考试风格</option></select></label><label>题型<select id="kind"><option value="">全部题型</option></select></label><label>最多用时<select id="minutes"><option value="">不限</option><option value="3">3 分钟</option><option value="5">5 分钟</option><option value="8">8 分钟</option><option value="10">10 分钟</option><option value="15">15 分钟</option></select></label><button id="clear" class="secondary wide">清除筛选</button></aside><section class="bank-results"><div class="bank-toolbar"><strong id="count">正在载入题库…</strong><span class="hint">点击题目可查看答案和评分标准</span><div class="bank-pagination"><button id="previous" class="secondary">上一页</button><button id="next" class="secondary">下一页</button></div></div><div id="results"></div></section></section></main><footer>Teacher Copilot · 让备课从教学目标出发</footer></body></html>
