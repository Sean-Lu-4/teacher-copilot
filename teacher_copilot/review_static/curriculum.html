<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Copilot · 全课程审核</title><link rel="stylesheet" href="/style.css"><script src="/curriculum.js" defer></script></head>
<body><header><a class="brand" href="/">Teacher Copilot<span>教师备课助手</span></a><nav><a class="nav-link" href="/">创建练习</a><a class="nav-link" href="/bank">浏览题库</a><a class="nav-link" href="/library">我的练习</a><a class="nav-link active" aria-current="page" href="/curriculum">课程审核</a></nav></header>
<main><section class="intro"><div class="eyebrow">AP COMPUTER SCIENCE A</div><h1>一次查看全课程，集中反馈。</h1><p id="overview">正在载入题库…</p><p id="scope"></p><a id="source" target="_blank" rel="noopener">课程范围依据：College Board CED</a></section>
<div class="workspace"><aside><h2>筛选题目</h2><p class="hint">默认展示考试层。可先抽看关注的 Topic，再集中反馈。</p>
<label>单元<select id="unit"><option value="">全部单元</option></select></label>
<label>Topic<select id="topic"><option value="">全部 Topic</option></select></label>
<label>难度<select id="tier"><option value="">全部难度</option><option value="2">基础</option><option value="3">巩固</option><option value="4" selected>考试风格</option></select></label>
<label>整体反馈<textarea id="overall" rows="5" maxlength="20000" placeholder="例如：希望增加选择题；数组题需要更难；某单元尚未教学。"></textarea></label>
<button id="save" class="primary wide" disabled>保存全部反馈</button><p class="hint">保存到本机项目文件夹；筛选不会丢弃已填意见。反馈不代表已经完成课堂试测。</p>
<p id="status" role="status" aria-live="polite"></p></aside>
<section><h2 id="count"></h2><div id="review-questions"></div></section></div></main></body></html>
